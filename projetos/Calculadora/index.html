<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Projeto Calculadora</h1>
    <main>
        <div class="calculadora">
    <input
        id="visor"
        type="text"
        class="visor"
        placeholder="0"
        readonly
    >
    <div class="botoes">
        <button class="limpar">C</button>
        <button class="apagar">⌫</button>
        <button class="operador">%</button>
        <button class="operador">/</button>
        <button class="numero">7</button>
        <button class="numero">8</button>
        <button class="numero">9</button>
        <button class="operador">*</button>
        <button class="numero">4</button>
        <button class="numero">5</button>
        <button class="numero">6</button>
        <button class="operador">-</button>
        <button class="numero">1</button>
        <button class="numero">2</button>
        <button class="numero">3</button>
        <button class="operador">+</button>
        <button class="numero">0</button>
        <button class="numero">.</button>
        <button class="igual">=</button>
    </div>
</div>
        <p>
            <a href="https://matheusoliveira710.github.io/teste_desenvolvimento_site/index.html">Voltar</a>
        </p>
    </main>
    <script src="script.js"></script>
</body>
</html>
