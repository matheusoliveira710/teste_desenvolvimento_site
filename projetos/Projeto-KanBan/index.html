<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>
        Projeto Kanban - Gerenciamento de Tarefas
    </h1>

    <!-- FORMULÁRIO -->
    <section class="formulario">

        <div class="campo">

            <label>
                Nome da tarefa
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite a tarefa"
            >

        </div>

        <div class="campo">

            <label>
                Prazo
            </label>

            <div class="data-hora-inputs">

                <input
                    type="date"
                    id="prazo"
                >

                <input
                    type="time"
                    id="hora"
                >

            </div>

        </div>

        <div class="campo">

            <label>
                Prioridade
            </label>

            <select id="prioridade">

                <option value="alta">
                    Alta 
                </option>

                <option value="média">
                    Média
                </option>

                <option value="baixa">
                    Baixa
                </option>

            </select>

        </div>

        <input
            type="text"
            id="pesquisa"
            placeholder="🔎 Pesquisar..."
            onkeyup="pesquisarTarefa()"
        >
        <button onclick="criarTarefa()">
            Criar tarefa
        </button>

    </section>

    <!-- KANBAN -->
    <section class="kanban">

        <div class="coluna" id="a-fazer">
            <h2 id="titulo-a-fazer">
                A Fazer (0) 
            </h2>
        </div>

        <div class="coluna" id="em-andamento">
            <h2 id="titulo-em-andamento">
                Em andamento (0)
            </h2>
        </div>

        <div class="coluna" id="concluido">
            <h2 id="titulo-concluido">
                Concluído (0)
            </h2>
        </div>

    </section>

    <main>

        <p>
            <a href="https://matheusoliveira710.github.io/teste_desenvolvimento_site/index.html" target="_blank">
                Voltar
            </a>
        </p>

    </main>

    <script src="script.js"></script>

    <footer>
        &copy; Desenvolvido por Matheus - 2026
    </footer>

</body>
</html>
