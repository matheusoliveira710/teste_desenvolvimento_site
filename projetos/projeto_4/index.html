<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <section id="agendamento-form">
        <h1>Agenda Barbearia</h1>
        <p>Agende seu horário conosco!</p>
        <div id="mensagem-status"></div>
        <form id="formAgendamento" onsubmit="event.preventDefault(); agendar();">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Seu nome" required>
            
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="(19) 99999-9999" required>
            
            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
            
            <label for="horario">Horário:</label>
            <input type="time" id="horario" required>
            
            <button type="submit" id="btnAgendar">Agendar</button>
        </form>
    </section>
</main>
    <footer>
        <p>&copy; 2026 Desenvolvido por Matheus. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
