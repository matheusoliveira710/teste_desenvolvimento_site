<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Agenda Barbearia</h1>
    <p>Agende seu horário conosco!</p>
    <form onsubmit="event.preventDefault(); agendar();">
        <input type="text" id="nome" placeholder="Digite seu nome">
        <input type="tel" id="telefone" placeholder="Digite seu telefone">
        <input type="email" id="email" placeholder="Digite seu e-mail">
        <input type="time" id="horario">
        <button type="submit">Agendar</button>
    </form>
    <footer>
        <p>&copy; 2026 Desenvolvido por Matheus. Todos os direitos reservados.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
