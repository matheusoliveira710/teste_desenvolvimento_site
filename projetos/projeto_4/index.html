<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CEP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        h1 {
            color: #007BFF;
            text-align: center;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 300px;
        }
        button {
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Consulta CEP</h1>
    <input type="text" id="cep" placeholder="Digite o CEP">
    <button onclick="buscarCEP()">
        Buscar CEP
    </button>
    <input type="text" id="rua" placeholder="Rua" readonly>
    <input type="text" id="bairro" placeholder="Bairro" readonly>
    <input type="text" id="cidade" placeholder="Cidade" readonly>
    <input type="text" id="uf" placeholder="UF" readonly>
    <script>
        function buscarCEP() {
            const cep = document.getElementById("cep").value.replace(/\D/g, "");
            if (cep.length !== 8) {
                alert("CEP inválido!");
                return;
            }
            document.getElementById("rua").value = "Carregando...";
            document.getElementById("bairro").value = "Carregando...";
            document.getElementById("cidade").value = "Carregando...";
            document.getElementById("uf").value = "Carregando...";
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(response => response.json())
            .then(data => {
                if (data.erro) {
                    alert("CEP não encontrado!");
                    return;
                }
                document.getElementById("rua").value = data.logradouro;
                document.getElementById("bairro").value = data.bairro;
                document.getElementById("cidade").value = data.localidade;
                document.getElementById("uf").value = data.uf;
            })
            .catch(() => {
                alert("Erro ao consultar o CEP.");
            });
        }
    </script>
</body>
</html>
